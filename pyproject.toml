[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-decisions"
version = "0.1.0"
description = "Typed decision contracts and model integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["jsonschema>=4.26,<5", "pydantic>=2.12,<3"]

[project.urls]
Repository = "https://github.com/kedi-lang/kedi-decisions"
Issues = "https://github.com/kedi-lang/kedi-decisions/issues"

[project.optional-dependencies]
typesafe = ["kedi-typesafe==0.3.0"]
laya = ["kedi-laya[torch,pydantic]==0.1.0"]
laya-mlx = ["kedi-laya[mlx,pydantic]==0.1.0"]
pydantic = ["pydantic-ai-slim==2.45.0"]
langchain = ["langchain==1.3.18"]

[dependency-groups]
dev = [
    "kedi-typesafe[all]", "kedi-laya[pydantic,langchain]",
    "pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "pytest-cov>=7,<8",
    "ruff>=0.14,<0.15", "basedpyright>=1.39.6,<1.40", "ty>=0.0.17,<0.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kedi-typesafe = { workspace = true }
kedi-laya = { workspace = true }
kedi-decisions = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests", "packages/kedi-typesafe/tests", "packages/kedi-laya/tests"]
markers = ["live: calls a real model and is excluded from normal quality gates"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["kedi_decisions", "kedi_typesafe", "kedi_laya"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_decisions"]
