name: Validate and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated workspace packages to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run quality gates and build packages
        run: make prod
      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Validate built wheels outside the workspace
        working-directory: ${{ runner.temp }}
        run: |
          uv venv package-smoke --python 3.12
          uv pip install --python package-smoke/bin/python \
            --find-links "$GITHUB_WORKSPACE/dist" \
            'kedi-decisions[pydantic,langchain]==0.1.0' \
            'kedi-typesafe[all]==0.3.0' 'kedi-laya[pydantic,langchain]==0.1.0'
          package-smoke/bin/python -c "import kedi_decisions, kedi_typesafe, kedi_laya; from kedi_typesafe import TypeSafeModel; from kedi_typesafe.integrations.langchain import TypeSafeChatModel"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - name: Publish validated distributions
        run: uv publish --check-url https://pypi.org/simple/ dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
