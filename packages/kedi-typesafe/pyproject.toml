[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-typesafe"
version = "0.3.4"
description = "TypeSafe AI integrations for Kedi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "kedi-decisions>=0.1.5,<0.2",
    "pydantic-ai-slim[typesafe]>=2.66.0,<2.67",
    "typesafe-sdk==0.7.5",
]

[project.urls]
Repository = "https://github.com/kedi-lang/kedi-decisions"
Issues = "https://github.com/kedi-lang/kedi-decisions/issues"

[project.optional-dependencies]
email = ["email-validator>=2.3,<3"]
langchain = ["langchain==1.4.9", "langchain-typesafe==0.0.1"]
phone = ["pydantic-extra-types>=2.11.1,<3", "phonenumbers>=9,<10"]
all = [
    "langchain-typesafe==0.0.1",
    "email-validator>=2.3,<3",
    "langchain==1.4.9",
    "pydantic-extra-types>=2.11.1,<3",
    "phonenumbers>=9,<10",
]

[dependency-groups]
dev = [
    "langchain-typesafe==0.0.1",
    "basedpyright>=1.40.2,<1.41",
    "email-validator>=2.3,<3",
    "langchain==1.4.9",
    "phonenumbers>=9,<10",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-cov>=7.1,<8",
    "pydantic-extra-types>=2.11.1,<3",
    "ruff>=0.17.4,<0.18",
    "ty>=0.0.98,<0.1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: calls the real TypeSafe API and is excluded from normal quality gates",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["kedi_typesafe"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_typesafe"]

[tool.uv.sources]
kedi-decisions = { workspace = true }
