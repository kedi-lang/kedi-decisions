[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-laya"
version = "0.1.2"
description = "Local Laya decision models for Kedi, Pydantic AI and LangChain"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Mert Sırakaya"},
    {name = "Doğukan Yiğit Polat"},
    {email = "mert@kedi-lang.org"},
    {email = "yigit@neurograph.net"},
]
dependencies = ["kedi-decisions>=0.1.6,<0.2"]

[project.urls]
Repository = "https://github.com/kedi-lang/kedi-decisions"
Issues = "https://github.com/kedi-lang/kedi-decisions/issues"

[project.optional-dependencies]
mlx = ["laya-mlx>=0.7,<0.8; sys_platform == 'darwin' and platform_machine == 'arm64'"]
torch = ["laya[vision,audio]>=0.5,<0.6"]
pydantic = ["kedi-decisions[pydantic]>=0.1.6,<0.2"]
langchain = ["kedi-decisions[langchain]>=0.1.6,<0.2"]

[tool.uv.sources]
kedi-decisions = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_laya"]
